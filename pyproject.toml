[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-customer-intelligence"
version = "1.0.0"
description = "End-to-End E-commerce Customer Intelligence & Personalization Platform"
authors = [{ name = "Data Science & ML Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "httpx>=0.25",
    "streamlit>=1.45",
    "plotly>=5.18",
    "seaborn>=0.13",
    "matplotlib>=3.8",
    "pytest>=7.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.pyright]
include = ["src", "app", "api", "tests"]
extraPaths = [".", "src"]
